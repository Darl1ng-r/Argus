name: Argus CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  typecheck-and-lint:
    name: 🛡️ Typecheck & Code Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install API Dependencies
        run: npm --prefix apps/api install

      - name: Install Web Dependencies
        run: npm --prefix apps/web install

      - name: Typecheck API (tsc)
        run: npm --prefix apps/api run build

      - name: Typecheck & Build Web (tsc + vite)
        run: npm --prefix apps/web run build

  unit-and-api-tests:
    name: 🧪 Automated Unit & API Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install API Dependencies
        run: npm --prefix apps/api install

      - name: Run Vitest Unit & API Tests
        run: npm --prefix apps/api run test

  security-audit:
    name: 🔐 Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Security Audit Production Packages (API)
        run: npm --prefix apps/api audit --omit=dev || true

      - name: Security Audit Production Packages (Web)
        run: npm --prefix apps/web audit --omit=dev || true

  docker-build-check:
    name: 🐳 Production Docker Container Builds
    runs-on: ubuntu-latest
    needs: [typecheck-and-lint, unit-and-api-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: false
          tags: argus-api:latest

      - name: Build Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          tags: argus-web:latest
