version: '3.8'

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: argus-prod-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - argus-network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: argus-prod-api
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://argus:argus_dev_secret@pgbouncer:6432/argus?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: production_hardened_secret_key_minimum_32_characters_argus_secure
      TRUST_PROXY: "1"
      METRICS_TOKEN: "argus_production_telemetry_metrics_token_secret"
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - argus-network

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: argus-prod-pgbouncer
    restart: always
    volumes:
      - ./docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "127.0.0.1:6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - argus-network

  postgres:
    image: postgres:15-alpine
    container_name: argus-prod-postgres
    restart: always
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus_dev_secret
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - argus-network

  redis:
    image: redis:7-alpine
    container_name: argus-prod-redis
    restart: always
    command: redis-server --save 60 1 --maxmemory 256mb --maxmemory-policy volatile-lru
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - argus-network

volumes:
  pgdata_prod:
  redisdata_prod:

networks:
  argus-network:
    driver: bridge
